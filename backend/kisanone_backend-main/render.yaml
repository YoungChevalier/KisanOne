services:
  - type: web
    name: kisanone-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard (keep secret)
      - key: DATABASE_NAME
        value: kisanone
      - key: JWT_SECRET
        sync: false          # Set this manually in Render dashboard (keep secret)
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL after deploying frontend
